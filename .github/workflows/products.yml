name: Product pages

on:
  push:
    branches: [main]
    paths: ["product.html", "site.js", "tools/build-products.mjs", ".github/workflows/products.yml"]
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: product-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build static product pages
        run: node tools/build-products.mjs .
      - name: Commit changes
        run: |
          git config user.name "pgs-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Product pages: nightly rebuild from the catalogue"
          git push
