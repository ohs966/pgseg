<script type="application/ld+json">{"@context": "https://schema.org", "@type": "FAQPage", "inLanguage": "ar-EG", "mainEntity": [{"@type": "Question", "name": "كيف أحصل على السعر؟", "acceptedAnswer": {"@type": "Answer", "text": "أضف الأصناف إلى قائمة الطلب، أو أرسل القائمة بالواتساب أو البريد. نرد بعرض سعر مفصل خلال 24 ساعة غالبا في أيام العمل."}}, {"@type": "Question", "name": "لماذا لا تظهر الأسعار على الموقع؟", "acceptedAnswer": {"@type": "Answer", "text": "الأسعار تعتمد على الماركة والكمية ومكان التوصيل وسعر الصرف، لذلك نسعر كل طلب لنعطيك أفضل سعر حالي."}}, {"@type": "Question", "name": "هل يوجد حد أدنى للطلب؟", "acceptedAnswer": {"@type": "Answer", "text": "لا يوجد حد أدنى ثابت. الطلبات الصغيرة قد يضاف لها مصاريف توصيل نوضحها في عرض السعر."}}, {"@type": "Question", "name": "أين توصلون؟", "acceptedAnswer": {"@type": "Answer", "text": "في جميع أنحاء مصر. القاهرة الكبرى والإسكندرية عادة خلال 1 إلى 3 أيام عمل للأصناف المتوفرة، وباقي المحافظات والأصناف المستوردة حسب المدة المذكورة في عرض السعر."}}, {"@type": "Question", "name": "كيف أدفع؟", "acceptedAnswer": {"@type": "Answer", "text": "تحويل بنكي أو شيك أو إنستاباي أو نقدا عند الاستلام للطلبات المعتمدة. تتاح فترات سداد للشركات المسجلة بعد أول الطلبات."}}, {"@type": "Question", "name": "هل تصدرون فواتير ضريبية؟", "acceptedAnswer": {"@type": "Answer", "text": "نعم، كل طلب يصدر له فاتورة إلكترونية مصرية شاملة ضريبة القيمة المضافة."}}, {"@type": "Question", "name": "هل يمكنكم توريد صنف غير موجود على الموقع؟", "acceptedAnswer": {"@type": "Answer", "text": "نعم. معظم ما نورده يتم توفيره حسب الطلب. استخدم خانة إضافة صنف غير موجود في صفحة الطلب، أو أرسل صورة أو رقم القطعة."}}, {"@type": "Question", "name": "ماذا لو وصل صنف خطأ أو تالف؟", "acceptedAnswer": {"@type": "Answer", "text": "أبلغنا خلال 3 أيام من الاستلام مع صورة ونستبدله أو نخصمه. الأصناف المصنعة أو المستوردة حسب الطلب لا ترد إلا في حالة العيب."}}]}</script>
